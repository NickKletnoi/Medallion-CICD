# The test job used by pull requests. It exists ONLY in the ci target (see "targets: ci" below), so prod never gets it.
# Steps: reset -> run everything once -> check -> run everything again (nothing may change) -> check -> remove the ci_ schemas.
targets:
  ci:
    resources:
      jobs:
        medallion_ci_test:
          name: medallion-ci-test
          max_concurrent_runs: 1
          parameters:
            - { name: catalog,       default: "${var.catalog}" }
            - { name: landing_root,  default: "${var.landing_root}" }
            - { name: schema_prefix, default: "${var.schema_prefix}" }
            - { name: rules_path,    default: "${workspace.file_path}/src/dq_rules.yml" }
          tasks:
            # 1 start from nothing
            - task_key: reset
              notebook_task: { notebook_path: ../tests/reset_schemas.py }
            # 2 first run: everything is new
            - task_key: dimensions_run1
              depends_on: [{ task_key: reset }]
              notebook_task: { notebook_path: ../src/01_dimensions.ipynb }
            - task_key: facts_run1
              depends_on: [{ task_key: dimensions_run1 }]
              notebook_task: { notebook_path: ../src/02_facts.ipynb }
            - task_key: verify_first
              depends_on: [{ task_key: facts_run1 }]
              notebook_task:
                notebook_path: ../tests/verify.py
                base_parameters:
                  phase: first
                  expected_fact_sales: "${var.expected_fact_sales}"
                  expected_fact_returns: "${var.expected_fact_returns}"
            # 3 second run with no new files: nothing may change
            - task_key: dimensions_run2
              depends_on: [{ task_key: verify_first }]
              notebook_task: { notebook_path: ../src/01_dimensions.ipynb }
            - task_key: facts_run2
              depends_on: [{ task_key: dimensions_run2 }]
              notebook_task: { notebook_path: ../src/02_facts.ipynb }
            - task_key: verify_rerun
              depends_on: [{ task_key: facts_run2 }]
              notebook_task:
                notebook_path: ../tests/verify.py
                base_parameters:
                  phase: rerun
                  expected_fact_sales: "${var.expected_fact_sales}"
                  expected_fact_returns: "${var.expected_fact_returns}"
            # 4 remove the ci_ schemas, whether the tests passed or not
            - task_key: cleanup
              depends_on: [{ task_key: verify_rerun }]
              run_if: ALL_DONE
              notebook_task: { notebook_path: ../tests/reset_schemas.py }
