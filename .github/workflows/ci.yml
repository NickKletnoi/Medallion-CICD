# Runs on every pull request to main.
#   checks       fast tests, no Databricks needed
#   integration  deploys the bundle as target "ci", runs it twice on the sample data (first run, then a rerun with no new files),
#                checks the results, and removes everything again
name: ci

on:
  pull_request:
    branches: [main]

# one Databricks test run at a time: they all use the same ci_ schemas and the same Landing_ci folder
concurrency:
  group: databricks-ci
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_repo.py

  integration:
    needs: checks
    # pull requests from forks get no secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci                       # GitHub environment "ci" holds the three secrets below
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # must be the landing_root of target "ci" in databricks.yml
      LANDING_CI: dbfs:/Volumes/main_lf/default/data/Landing_ci
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate the bundle
        run: databricks bundle validate -t ci

      - name: Put the sample files in the ci landing folder
        run: |
          databricks fs rm -r "$LANDING_CI" 2>/dev/null || true
          for kind in dims facts; do
            databricks fs mkdir "$LANDING_CI/$kind"
            for f in test_data/Batch*/$kind/*.csv; do
              databricks fs cp "$f" "$LANDING_CI/$kind/$(basename "$f")" --overwrite
            done
          done

      - name: Deploy
        run: databricks bundle deploy -t ci

      - name: Run the test workflow (two runs + checks)
        run: databricks bundle run medallion_ci_test -t ci

      - name: Clean up
        if: always()
        run: |
          databricks bundle destroy -t ci --auto-approve || true
          databricks fs rm -r "$LANDING_CI" || true
