# Databricks Asset Bundle: the notebooks, the rules file and the workflow, deployed the same way to every environment.
#   dev   your own copy (schemas dev_<you>_bronze/silver/gold), deployed from your machine or Cloud Shell
#   ci    a throw-away copy (schemas ci_*) that a pull request deploys, runs the tests on and removes again
#         (its test job lives in jobs/medallion_ci_test.yml)
# This is the ONE master file: variables and environments. Every job is its own file in jobs/.
#   prod  the real thing, deployed by the pipeline after a merge to main
# The workspace host and credentials are NOT in this file: they come from the Databricks CLI profile (dev) or from the
# DATABRICKS_HOST / DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET environment variables (GitHub Actions).
bundle:
  name: medallion

include:
  - jobs/*.yml          # one file per job; this is the only other bundle file you edit

variables:
  catalog:
    description: Unity Catalog catalog; the bronze / silver / gold schemas live inside it
    default: main_lf
  landing_root:
    description: Volume folder with the dims/ and facts/ source folders
    default: /Volumes/main_lf/default/data/Landing
  schema_prefix:
    description: Put in front of bronze / silver / gold. Empty = the real schemas
    default: ""
  expected_fact_sales:
    description: Exact row count the CI test expects for the sample data (empty = do not check)
    default: ""
  expected_fact_returns:
    default: ""

targets:
  dev:
    mode: development            # resource names get a [dev <you>] prefix, the schedule is paused
    default: true
    variables:
      schema_prefix: dev_${workspace.current_user.short_name}_
      landing_root: /Volumes/main_lf/default/data/Landing_dev

  ci:
    mode: development
    variables:
      schema_prefix: ci_
      landing_root: /Volumes/main_lf/default/data/Landing_ci
      expected_fact_sales: "394"      # sample data of test_data/ (Batch1 to Batch4)
      expected_fact_returns: "33"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_prefix: ""
    # Recommended: run the job as a service principal instead of the person who deploys.
    # run_as:
    #   service_principal_name: "<application id of the service principal>"
